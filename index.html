<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>硫容时耗预测 · 拟合散点</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Roboto, system-ui, sans-serif; background: #f5f9fe; padding: 30px 20px; color: #1a2639; }
        .container { max-width: 1300px; margin: 0 auto; }
        .card { background: white; border-radius: 24px; padding: 24px 28px; box-shadow: 0 10px 30px rgba(0,20,40,0.06); margin-bottom: 28px; border: 1px solid #e9f0f9; transition: box-shadow 0.2s; }
        .card:hover { box-shadow: 0 14px 40px rgba(0,20,40,0.10); }
        h2 { font-weight: 600; font-size: 1.5rem; letter-spacing: -0.3px; display: flex; align-items: center; gap: 8px; margin-bottom: 18px; color: #0b2b4a; }
        h2 small { font-size: 0.9rem; font-weight: 400; color: #4c6a8a; margin-left: 8px; }
        .sub-muted { font-size: 0.95rem; font-weight: 600; color: #4c6a8a; }
        .chart-title-muted { font-size: 0.8rem; font-weight: 400; color: #4c6a8a; }
        .row { display: flex; flex-wrap: wrap; gap: 24px; align-items: stretch; }
        .col { flex: 1 1 300px; display: flex; }
        .col .card { flex: 1; display: flex; flex-direction: column; }
        .file-zone { display: flex; flex-wrap: wrap; align-items: center; gap: 18px 25px; background: #f0f6ff; padding: 18px 22px; border-radius: 48px; border: 1px dashed #a0c0e0; }
        .file-label { background: #1d3b61; color: white; padding: 10px 22px; border-radius: 40px; font-weight: 500; font-size: 0.95rem; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: 0.15s; border: none; }
        .file-label:hover { background: #143049; transform: scale(1.02); }
        .file-label input { display: none; }
        #file-status { color: #1a4b77; font-weight: 450; }
        .btn { background: #1d3b61; border: none; color: white; padding: 10px 32px; border-radius: 40px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: 0.15s; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 4px 10px rgba(26, 67, 113, 0.15); }
        .btn:active { transform: scale(0.96); }
        .btn:disabled { opacity: 0.5; pointer-events: none; filter: grayscale(0.5); }
        .btn-success { background: #0f7b4b; }
        .btn-success:hover { background: #0a5f3a; }
        .btn-outline { background: transparent; border: 1.5px solid #1d3b61; color: #1d3b61; box-shadow: none; }
        .btn-outline:hover { background: #eef4fc; }
        .grid-7 { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap: 16px 20px; background: #f8fcff; padding: 18px 20px; border-radius: 20px; border: 1px solid #e2edf7; }
        .input-group { display: flex; flex-direction: column; gap: 4px; }
        .input-group label { font-weight: 500; font-size: 0.82rem; color: #2d4a6e; letter-spacing: 0.3px; }
        .input-group input { padding: 8px 12px; border: 1px solid #cdddee; border-radius: 14px; font-size: 0.95rem; background: white; transition: 0.1s; width: 100%; }
        .input-group input:focus { border-color: #1d3b61; outline: 2px solid #b3cef0; }
        .ratio-action-row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px 20px; background: #f8fcff; padding: 18px 20px; border-radius: 20px; border: 1px solid #e2edf7; margin-top: 16px; }
        .ratio-action-row .input-group { flex: 0 0 150px; }
        .ratio-action-row .btn-group { display: flex; flex-wrap: wrap; gap: 12px; flex: 1; align-items: flex-end; }
        .result-box { background: #e3effa; border-radius: 20px; padding: 18px 24px; display: flex; align-items: center; flex-wrap: wrap; margin-top: 16px; }
        .result-number { font-size: 2.4rem; font-weight: 700; color: #0b2b4a; letter-spacing: -0.5px; }
        .result-number small { font-size: 1.2rem; font-weight: 400; color: #32567a; margin-left: 6px; }
        .metric-badge { background: white; padding: 6px 20px; border-radius: 40px; font-weight: 500; box-shadow: 0 2px 8px rgba(0,0,0,0.02); font-size: 0.95rem; }
        .chart-container { position: relative; height: 280px; margin-top: 12px; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .mt-2 { margin-top: 16px; }
        .mb-1 { margin-bottom: 8px; }
        .op-6 { opacity: 0.7; }
        .text-muted { color: #3f5d7c; }
        .tag { background: #c4d9f0; padding: 4px 14px; border-radius: 30px; font-size: 0.8rem; font-weight: 500; }
        .eval-metrics { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 12px; }
        .card-content { display: flex; flex-direction: column; flex: 1; }
        .chart-wrapper { flex: 1; display: flex; flex-direction: column; margin-top: 16px; }
        .chart-wrapper .chart-container { flex: 1; min-height: 220px; }
        .left-card-content { display: flex; flex-direction: column; flex: 1; }
        .left-card-content .grid-7 { flex-shrink: 0; }
        .left-card-content .ratio-action-row { flex-shrink: 0; }
        .left-card-content .result-box { margin-top: auto; flex-shrink: 0; }
        /* 加载提示覆盖层 */
        #loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.92); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; font-size: 1.2rem; color: #1a2639; }
        #loading-overlay .spinner { width: 48px; height: 48px; border: 4px solid #e0e8f0; border-top-color: #1d3b61; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading-overlay .status-text { color: #4c6a8a; font-size: 0.95rem; margin-top: 8px; }
        #loading-overlay .error-text { color: #c0392b; font-size: 0.95rem; margin-top: 8px; display: none; }
        @media (max-width: 700px) {
            .card { padding: 18px; }
            .file-zone { flex-direction: column; align-items: stretch; border-radius: 28px; }
            .result-number { font-size: 2rem; }
            .ratio-action-row { flex-direction: column; align-items: stretch; }
            .ratio-action-row .input-group { flex: 1; }
            .ratio-action-row .btn-group { justify-content: flex-start; }
            .col { flex: 1 1 100%; }
            .chart-container { height: 240px; }
        }
        /* 隐藏主体直到库加载完成 */
        #app-content { display: none; }
        #app-content.ready { display: block; }
    </style>
</head>
<body>

<!-- 加载覆盖层 -->
<div id="loading-overlay">
    <div class="spinner"></div>
    <div>⏳ 加载依赖库中...</div>
    <div class="status-text" id="loadStatus">正在尝试连接 CDN...</div>
    <div class="error-text" id="loadError">⚠️ 所有 CDN 均无法连接，请检查网络或联系管理员</div>
</div>

<div id="app-content">
<div class="container">
    <h1 style="font-weight:600; font-size:2rem; margin-bottom:8px;">⏱️ 硫容时耗预测</h1>
    <p style="color:#3e5f81; margin-bottom:32px;">上传 Excel 数据 → 训练模型 → 输入参数 → 预测时耗 + 拟合散点图</p>

    <div class="card">
        <h2>📁 数据 <small>支持 .xlsx / .xls</small></h2>
        <div class="file-zone">
            <label class="file-label">
                <span>📤 选择文件</span>
                <input type="file" id="fileInput" accept=".xlsx,.xls">
            </label>
            <span id="file-status">未选择文件</span>
            <button class="btn btn-success" id="trainBtn">🚀 训练模型</button>
            <span id="train-status" style="margin-left:auto; font-weight:450;">待训练</span>
        </div>
        <div style="margin-top:16px; display:flex; gap:10px; flex-wrap:wrap;">
            <span class="tag">特征: bet · 2-10 · 10-20 · 20-50 · &gt;50 · c值 · 比重</span>
            <span class="tag">目标: 时耗</span>
            <span class="tag" id="sampleCountTag">样本: 0</span>
        </div>
    </div>

    <div class="row">
        <div class="col" style="flex:1.2;">
            <div class="card">
                <div class="left-card-content">
                    <h2>📥 输入特征 <small>预测新样本</small></h2>
                    <div class="grid-7" style="grid-template-columns: repeat(auto-fill, minmax(150px,1fr));">
                        <div class="input-group"><label>bet</label><input type="number" step="any" id="inp_bet" value="30.0"></div>
                        <div class="input-group"><label>2-10</label><input type="number" step="any" id="inp_2_10" value="0.040"></div>
                        <div class="input-group"><label>10-20</label><input type="number" step="any" id="inp_10_20" value="0.032"></div>
                        <div class="input-group"><label>20-50</label><input type="number" step="any" id="inp_20_50" value="0.030"></div>
                        <div class="input-group"><label>&gt;50</label><input type="number" step="any" id="inp_gt50" value="0.070"></div>
                        <div class="input-group"><label>c值</label><input type="number" step="any" id="inp_c" value="55"></div>
                    </div>
                    <div class="ratio-action-row">
                        <div class="input-group">
                            <label>比重</label>
                            <input type="number" step="any" id="inp_ratio" value="0.42">
                        </div>
                        <div class="btn-group">
                            <button class="btn" id="predictBtn">🔮 预测时耗</button>
                            <button class="btn btn-outline" id="resetInputBtn">↺ 重置示例</button>
                        </div>
                    </div>
                    <div class="result-box">
                        <div style="display:flex; align-items:center; gap:24px; flex-wrap:wrap; width:100%;">
                            <div>
                                <div style="font-weight:400; color:#23517a; font-size:0.9rem;">预测时耗：</div>
                                <div class="result-number" id="predictionDisplay">— <small>kg</small></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col" style="flex:1;">
            <div class="card">
                <div class="card-content">
                    <h2>
                        📊 模型评估
                        <span class="sub-muted">(训练集留一法)</span>
                    </h2>
                    <div class="eval-metrics">
                        <span class="metric-badge" id="maeDisplay">MAE： —</span>
                        <span class="metric-badge" id="r2Display">R²： —</span>
                    </div>
                    <div class="chart-wrapper">
                        <div class="flex-between">
                            <span style="font-weight:500;">📈 实际时耗 vs 预测时耗</span>
                            <span class="chart-title-muted" id="chartNote">需要训练后显示</span>
                        </div>
                        <div class="chart-container">
                            <canvas id="metricsChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</div>

<script>
    // ============================================================
    // 多 CDN 自动加载器 —— 尝试多个源，哪个能用用哪个
    // ============================================================
    (function loadLibraries() {
        const overlay = document.getElementById('loading-overlay');
        const statusText = document.getElementById('loadStatus');
        const errorText = document.getElementById('loadError');
        const appContent = document.getElementById('app-content');

        // CDN 列表（按优先级排序，国内优先）
        const CDN_LIST = [
            // 国内镜像（优先）
            { name: 'staticfile (国内)', chart: 'https://cdn.staticfile.org/Chart.js/4.4.0/chart.umd.min.js', xlsx: 'https://cdn.staticfile.org/xlsx/0.18.5/xlsx.full.min.js' },
            { name: 'bootcdn (国内)', chart: 'https://cdn.bootcdn.net/ajax/libs/Chart.js/4.4.0/chart.umd.min.js', xlsx: 'https://cdn.bootcdn.net/ajax/libs/xlsx/0.18.5/xlsx.full.min.js' },
            // 国际 CDN（备选）
            { name: 'cdnjs (国际)', chart: 'https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js', xlsx: 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js' },
            { name: 'jsdelivr (国际)', chart: 'https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js', xlsx: 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js' },
            { name: 'unpkg (国际)', chart: 'https://unpkg.com/chart.js@4.4.0/dist/chart.umd.min.js', xlsx: 'https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js' },
        ];

        let currentIndex = 0;
        let chartLoaded = false;
        let xlsxLoaded = false;
        let allLoaded = false;

        function checkAllLoaded() {
            if (chartLoaded && xlsxLoaded && !allLoaded) {
                allLoaded = true;
                // 隐藏加载层，显示内容
                overlay.style.display = 'none';
                appContent.classList.add('ready');
                console.log('✅ 所有库加载完成！');
                // 触发页面初始化
                if (typeof initApp === 'function') initApp();
            }
        }

        function tryNextCDN() {
            if (currentIndex >= CDN_LIST.length) {
                // 所有 CDN 都失败了
                statusText.textContent = '❌ 所有 CDN 均无法连接';
                errorText.style.display = 'block';
                document.querySelector('.spinner').style.display = 'none';
                return;
            }

            const cdn = CDN_LIST[currentIndex];
            statusText.textContent = `🔄 尝试 ${cdn.name} ...`;
            console.log(`尝试 CDN: ${cdn.name}`);

            let chartDone = false;
            let xlsxDone = false;
            let hasError = false;

            function onError(libName) {
                if (hasError) return;
                hasError = true;
                console.warn(`❌ ${cdn.name} 加载失败 (${libName})`);
                currentIndex++;
                tryNextCDN();
            }

            function onChartLoad() {
                if (chartDone) return;
                chartDone = true;
                chartLoaded = true;
                console.log(`✅ Chart.js 从 ${cdn.name} 加载成功`);
                if (xlsxDone) {
                    checkAllLoaded();
                }
            }

            function onXlsxLoad() {
                if (xlsxDone) return;
                xlsxDone = true;
                xlsxLoaded = true;
                console.log(`✅ SheetJS 从 ${cdn.name} 加载成功`);
                if (chartDone) {
                    checkAllLoaded();
                }
            }

            // 加载 Chart.js
            const chartScript = document.createElement('script');
            chartScript.src = cdn.chart;
            chartScript.onload = onChartLoad;
            chartScript.onerror = function() {
                if (chartDone) return;
                chartDone = true;
                // 不立即报错，等 xlsx 也失败再跳转
                if (xlsxDone) {
                    onError('Chart.js');
                } else {
                    // 标记 chart 失败，但等 xlsx 结果
                    setTimeout(() => {
                        if (!chartLoaded) onError('Chart.js');
                    }, 3000);
                }
            };
            document.head.appendChild(chartScript);

            // 加载 SheetJS
            const xlsxScript = document.createElement('script');
            xlsxScript.src = cdn.xlsx;
            xlsxScript.onload = onXlsxLoad;
            xlsxScript.onerror = function() {
                if (xlsxDone) return;
                xlsxDone = true;
                if (chartDone) {
                    onError('SheetJS');
                } else {
                    setTimeout(() => {
                        if (!xlsxLoaded) onError('SheetJS');
                    }, 3000);
                }
            };
            document.head.appendChild(xlsxScript);

            // 超时保护：10秒后如果还没加载完，尝试下一个 CDN
            setTimeout(() => {
                if (!chartLoaded || !xlsxLoaded) {
                    if (!hasError) {
                        hasError = true;
                        console.warn(`⏰ ${cdn.name} 加载超时`);
                        currentIndex++;
                        tryNextCDN();
                    }
                }
            }, 10000);
        }

        // 开始尝试第一个 CDN
        tryNextCDN();
    })();
</script>

<script>
    // ============================================================
    // 应用主逻辑（在库加载完成后执行）
    // ============================================================
    function initApp() {
        console.log('🚀 应用初始化...');

        let rawData = [];
        let trainedModel = null;
        let chartInstance = null;

        const fileInput = document.getElementById('fileInput');
        const fileStatus = document.getElementById('file-status');
        const trainBtn = document.getElementById('trainBtn');
        const trainStatus = document.getElementById('train-status');
        const sampleCountTag = document.getElementById('sampleCountTag');

        const predictBtn = document.getElementById('predictBtn');
        const resetBtn = document.getElementById('resetInputBtn');
        const predictionDisplay = document.getElementById('predictionDisplay');
        const maeDisplay = document.getElementById('maeDisplay');
        const r2Display = document.getElementById('r2Display');
        const chartNote = document.getElementById('chartNote');

        const inp_bet = document.getElementById('inp_bet');
        const inp_2_10 = document.getElementById('inp_2_10');
        const inp_10_20 = document.getElementById('inp_10_20');
        const inp_20_50 = document.getElementById('inp_20_50');
        const inp_gt50 = document.getElementById('inp_gt50');
        const inp_c = document.getElementById('inp_c');
        const inp_ratio = document.getElementById('inp_ratio');

        function parseExcelFile(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                        const json = XLSX.utils.sheet_to_json(firstSheet, { defval: '' });
                        resolve(json);
                    } catch (err) {
                        reject(err);
                    }
                };
                reader.onerror = (err) => reject(err);
                reader.readAsArrayBuffer(file);
            });
        }

        function extractDataFromJSON(jsonArray) {
            const normalize = (s) => String(s).trim().toLowerCase();
            const findKey = (obj, patternList) => {
                const keys = Object.keys(obj);
                for (let p of patternList) {
                    const found = keys.find(k => normalize(k) === normalize(p));
                    if (found) return found;
                }
                return null;
            };

            const rows = [];
            for (const row of jsonArray) {
                const betKey = findKey(row, ['bet', 'bet值']);
                const key2_10 = findKey(row, ['2-10', '2_10']);
                const key10_20 = findKey(row, ['10-20', '10_20']);
                const key20_50 = findKey(row, ['20-50', '20_50']);
                const keyGt50 = findKey(row, ['>50', '大于50']);
                const keyC = findKey(row, ['c值', 'c']);
                const keyRatio = findKey(row, ['比重']);
                const keyTarget = findKey(row, ['时耗', 'time']);

                if (!betKey || !key2_10 || !key10_20 || !key20_50 || !keyGt50 || !keyC || !keyRatio || !keyTarget) {
                    continue;
                }
                const val = (v) => parseFloat(row[v]);
                if ([betKey, key2_10, key10_20, key20_50, keyGt50, keyC, keyRatio, keyTarget].some(k => isNaN(val(k)))) {
                    continue;
                }
                rows.push({
                    bet: val(betKey),
                    '2-10': val(key2_10),
                    '10-20': val(key10_20),
                    '20-50': val(key20_50),
                    '>50': val(keyGt50),
                    'c值': val(keyC),
                    '比重': val(keyRatio),
                    '时耗': val(keyTarget)
                });
            }
            return rows;
        }

        function trainModel(dataRows) {
            if (!dataRows || dataRows.length < 2) {
                return { error: '数据不足，至少需要2条样本' };
            }
            const X = dataRows.map(r => [r.bet, r['2-10'], r['10-20'], r['20-50'], r['>50'], r['c值'], r['比重']]);
            const y = dataRows.map(r => r['时耗']);

            const n = X.length;
            const dim = X[0].length;
            const mins = Array(dim).fill(Infinity);
            const maxs = Array(dim).fill(-Infinity);
            for (let i=0; i<n; i++) {
                for (let j=0; j<dim; j++) {
                    if (X[i][j] < mins[j]) mins[j] = X[i][j];
                    if (X[i][j] > maxs[j]) maxs[j] = X[i][j];
                }
            }
            const ranges = maxs.map((max, j) => max - mins[j] || 1);

            function normalize(vec) {
                return vec.map((v, j) => (v - mins[j]) / ranges[j]);
            }
            const X_norm = X.map(row => normalize(row));

            const looPred = [];
            for (let i=0; i<n; i++) {
                const trainX = X_norm.filter((_, idx) => idx !== i);
                const trainY = y.filter((_, idx) => idx !== i);
                const testVec = X_norm[i];

                const dists = trainX.map((vec, idx) => {
                    const d = Math.sqrt(vec.reduce((sum, v, j) => sum + (v - testVec[j])**2, 0));
                    return { dist: d, label: trainY[idx] };
                });
                dists.sort((a,b) => a.dist - b.dist);
                const k = Math.min(2, dists.length);
                let sumWeight = 0, weightedSum = 0;
                for (let t=0; t<k; t++) {
                    const weight = 1 / (dists[t].dist + 1e-6);
                    weightedSum += weight * dists[t].label;
                    sumWeight += weight;
                }
                const pred = weightedSum / sumWeight;
                looPred.push(pred);
            }

            const maeVal = looPred.reduce((s, pred, i) => s + Math.abs(pred - y[i]), 0) / n;
            const meanY = y.reduce((a,b) => a+b, 0)/n;
            const ssTot = y.reduce((s, val) => s + (val - meanY)**2, 0);
            const ssRes = looPred.reduce((s, pred, i) => s + (pred - y[i])**2, 0);
            const r2Val = 1 - ssRes / ssTot;

            return {
                X_norm,
                y,
                mins,
                ranges,
                looPred,
                mae: maeVal,
                r2: r2Val,
                dataRows
            };
        }

        function predictSample(model, inputVec) {
            if (!model) return null;
            const { X_norm, y, mins, ranges } = model;
            const normInput = inputVec.map((v, j) => (v - mins[j]) / ranges[j]);
            const dists = X_norm.map((vec, idx) => {
                const d = Math.sqrt(vec.reduce((sum, v, j) => sum + (v - normInput[j])**2, 0));
                return { dist: d, label: y[idx] };
            });
            dists.sort((a,b) => a.dist - b.dist);
            const k = Math.min(2, dists.length);
            let sumWeight = 0, weightedSum = 0;
            for (let t=0; t<k; t++) {
                const weight = 1 / (dists[t].dist + 1e-6);
                weightedSum += weight * dists[t].label;
                sumWeight += weight;
            }
            return weightedSum / sumWeight;
        }

        async function handleTrain() {
            const file = fileInput.files[0];
            if (!file) {
                alert('请先选择一个 Excel 文件 (.xlsx 或 .xls)');
                return;
            }
            trainBtn.disabled = true;
            trainStatus.textContent = '⏳ 解析中...';
            try {
                const json = await parseExcelFile(file);
                const dataRows = extractDataFromJSON(json);
                if (dataRows.length === 0) {
                    alert('未解析到有效数据。请检查列名是否包含: bet, 2-10, 10-20, 20-50, >50, c值, 比重, 时耗');
                    trainStatus.textContent = '❌ 解析失败';
                    trainBtn.disabled = false;
                    return;
                }
                rawData = dataRows;
                sampleCountTag.textContent = `样本: ${dataRows.length}`;
                fileStatus.textContent = `✅ ${file.name} (${dataRows.length} 条)`;

                trainStatus.textContent = '🔄 训练中 (KNN) ...';
                const model = trainModel(dataRows);
                if (model.error) {
                    alert(model.error);
                    trainStatus.textContent = '❌ 训练失败';
                    trainBtn.disabled = false;
                    return;
                }
                trainedModel = model;
                updateMetrics(model);
                updateChart(model);
                trainStatus.textContent = '✅ 训练完成';
                doPredict();
            } catch (err) {
                console.error(err);
                alert('文件解析错误: ' + err.message);
                trainStatus.textContent = '❌ 错误';
            }
            trainBtn.disabled = false;
        }
